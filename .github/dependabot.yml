version: 2

# Updates are proposals, not auto-merges. Review exact versions, wheel hashes,
# npm integrity and the install runner's reviewed hashes before accepting a PR.
# Historical receipts are evidence, not active dependency manifests.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /examples/local-backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tests/fixtures/docker-fastapi
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /scripts/skills-cli-runtime
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
