name: Validate toolkit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-local-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated HTTP lab dependencies with reviewed hashes
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all:
          -r examples/local-backend/requirements-http.txt
      - run: python3 -m pip check
      - name: Validate tokens, local HTTP framing and temporary sessions
        run: python3 -B -m unittest discover -s examples/local-backend/http-tests -v
      - name: Exercise signed requests on loopback only (no OCI)
        run: python3 -B examples/local-backend/http_smoke.py
      - name: Rehearse offline identity bindings and public-key rotation (no provider calls)
        run: python3 -B examples/local-backend/provider_demo.py

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.20.0"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: Resolve package names from reviewed package builder
        id: packages
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, "scripts")
          import build_release

          specs = {item.kind: item for item in build_release.package_specs(build_release.load_version())}
          values = {
              "skill_root": specs["skill-only"].archive_root,
              "skill_archive": specs["skill-only"].archive_file,
              "toolkit_root": specs["full-toolkit"].archive_root,
              "toolkit_archive": specs["full-toolkit"].archive_file,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
      - run: python3 scripts/validate_agent_plugin_schema.py
      - run: python3 scripts/scan_release_sources.py
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise synthetic local backend journey (no network or OCI)
        run: python3 -B examples/local-backend/demo.py
      - run: python3 -m unittest discover -s blueprints/container-api/tests -v
      - run: python3 scripts/build_release.py check
      - run: python3 scripts/build_release.py build --output-dir dist
      - run: python3 scripts/build_release.py verify --output-dir dist
      - run: mkdir "${{ runner.temp }}/oci-founder-packages"
      - run: >-
          tar -xzf "dist/${{ steps.packages.outputs.skill_archive }}"
          -C "${{ runner.temp }}/oci-founder-packages"
      - run: >-
          python3 scripts/qualify_skill_install.py --allow-download
          --source "${{ runner.temp }}/oci-founder-packages/${{ steps.packages.outputs.skill_root }}"
      - run: >-
          tar -xzf "dist/${{ steps.packages.outputs.toolkit_archive }}"
          -C "${{ runner.temp }}/oci-founder-packages"
      - run: >-
          python3 scripts/qualify_skill_install.py --allow-download
          --source "${{ runner.temp }}/oci-founder-packages/${{ steps.packages.outputs.toolkit_root }}"
      - run: terraform fmt -check -recursive blueprints/container-api/terraform
      - run: terraform -chdir=blueprints/container-api/terraform/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=blueprints/container-api/terraform/bootstrap validate -no-color
      - run: terraform -chdir=blueprints/container-api/terraform/runtime init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=blueprints/container-api/terraform/runtime validate -no-color
